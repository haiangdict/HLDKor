<script>
const LEMMATA_URL = './data/KOR-Lemmata.csv';
const SENSES_URL = './data/KOR-Senses.csv';
const ETYMOLOGY_URL = './data/HLD-Etymology.csv';
const EXAMPLES_URL = './data/KOR-Examples.csv';

let entries = [];          // Lemmata rows
let lemmataById = {};       // "編號_語別" -> entry
let sensesByLemma = {};     // "編號_語別" -> [sense objects]
let conjugatedFormsIndex = {}; // 衍生變化形文字 -> Set(詞目編號)，供精確搜尋反查用
let derivedWordsByLemma = {}; // "編號_語別"(來源詞目，無#義項編號的引用) -> Set(引用此詞目的詞目編號)
let derivedWordsBySense = {}; // "編號_語別_義項編號"(來源義項，有#義項編號的引用) -> Set(引用此義項的詞目編號)
let etymologyByCode = {};   // code -> etymology object
let examplesBySense = {};   // 義項 id -> [example objects]

function lemmaKey(id, dial) { return id + '_' + dial; }

// 翻譯／TL／POJ 顯示切換：transOrder決定「翻譯」還是「羅馬字」放前面，romSystem決定用TL還是POJ
let transOrder = 'trans'; // 'trans'(翻譯優先) | 'rom'(羅馬字優先)
let romSystem = 'TL';     // 'TL' | 'POJ'

let azSectionOpen = true;         // 預設全部展開
let activeLetter = null;          // 目前顯示的字母（分頁式渲染，一次只渲染一個字母）

const LEVELS = ['B', 'I', 'S', 'U'];
let selectedLevels = new Set(LEVELS); // 預設全部勾選
let levelSectionOpen = true;          // 預設全部展開

let ALL_CATEGORIES = [];              // 載入資料後填入（見 loadData），保留原始文字，不合併
let selectedCategories = new Set();   // 載入資料後會預設全部勾選
let categorySectionOpen = false;      // 選項很多，預設收合

// ── 搜尋 ──
let searchQuery = '';
let searchExact = false;
let searchScope = { lemma: true, example: true }; // 兩者都開＝不限範圍

const LEVEL_ICONS = { 'B': '★★★★', 'I': '★★★☆', 'S': '★★☆☆', 'U': '★☆☆☆' };

// ── CSV parsing (handles quoted fields, keeps blank-header column) ──
// 正確處理「欄位內本身就有換行」的情況(例如對話式例句 -가:...\n-나:...)——
// 不能先用換行符號把整份檔案切成一行一行，要逐字掃描、跟著引號狀態走，
// 只有在「不在引號內」的換行才是真正的換列(row)邊界。
function parseCSV(text) {
  text = text.replace(/^\ufeff/, '');
  const allRows = [];
  let row = [];
  let cur = '';
  let inQ = false;
  const len = text.length;
  for (let i = 0; i < len; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') {
        if (text[i + 1] === '"') { cur += '"'; i++; } // 跳脫的雙引號("")
        else { inQ = false; }
      } else {
        cur += c;
      }
      continue;
    }
    if (c === '"') { inQ = true; continue; }
    if (c === ',') { row.push(cur); cur = ''; continue; }
    if (c === '\r') { continue; }
    if (c === '\n') { row.push(cur); allRows.push(row); row = []; cur = ''; continue; }
    cur += c;
  }
  if (cur !== '' || row.length > 0) { row.push(cur); allRows.push(row); }
  while (allRows.length && allRows[allRows.length - 1].length === 1 && allRows[allRows.length - 1][0] === '') allRows.pop();
  if (!allRows.length) return { headers: [], rows: [] };
  const headers = allRows[0].map(h => h.trim());
  return { headers, rows: allRows.slice(1) };
}

function rowsToObjects(headers, rows) {
  return rows.map(cols => {
    const obj = {};
    headers.forEach((h, i) => { obj[h] = (cols[i] || '').trim(); });
    return obj;
  });
}

// 詞綴標記：詞形最前方和/或最後方連續的 - 代表前綴/中綴/後綴標記，
// 不列入字母排序依據，顯示時以半透明呈現（跟 ne 一樣的透明度），
// 但仍算是詞形本身的一部分（影響之後的搜尋功能，所以不能整個拿掉，只是視覺淡化）。
function splitAffixDashes(word) {
  let core = word;
  let lead = '', trail = '';
  const leadMatch = core.match(/^-+/);
  if (leadMatch) { lead = leadMatch[0]; core = core.slice(lead.length); }
  const trailMatch = core.match(/-+$/);
  if (trailMatch) { trail = trailMatch[0]; core = core.slice(0, core.length - trail.length); }
  return { lead, core, trail };
}

// 韓文的19個初聲子音，依字典排序順序
const CHOSEONG = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];

function firstLetter(word) {
  let w = (word || '').trim();
  if (w.startsWith('\u2019')) w = w.slice(1); // leading glottal-stop mark not used for indexing
  w = splitAffixDashes(w).core || w; // 詞綴 - 不列入排序依據
  if (!w) return '#';
  // 韓文是拼音組合文字：組合過的音節(如「가」)要拆開取「初聲子音」分組，
  // 不能把整個組合完的音節當成一個獨立字母，否則會產生成千上萬種「字母」，
  // 也違反韓文字典慣用的排序方式（依初聲子音分組，例如 가/거/고/구 都歸在 ㄱ）。
  const code = w.codePointAt(0);
  if (code >= 0xAC00 && code <= 0xD7A3) {
    const choseongIndex = Math.floor((code - 0xAC00) / (21 * 28));
    return CHOSEONG[choseongIndex];
  }
  if (CHOSEONG.includes(w[0])) return w[0]; // 本身就是單獨的子音字母(如 ㄹ 거예요)
  return w[0].toLowerCase();
}

// 字母排序順序：依韓文初聲子音的字典順序排列
const LETTER_ORDER = CHOSEONG;
function compareLetters(a, b) {
  const ia = LETTER_ORDER.indexOf(a), ib = LETTER_ORDER.indexOf(b);
  if (ia === -1 && ib === -1) return a < b ? -1 : (a > b ? 1 : 0);
  if (ia === -1) return 1;  // 不在表列裡的排最後
  if (ib === -1) return -1;
  return ia - ib;
}
function sortLetters(letters) { return letters.slice().sort(compareLetters); }

// ══════════════════════════════════════════════════════════════════
// 韓語動詞/形容詞變化引擎
// 「動詞變化」欄位存的是「變化分組代碼」(規則/ㅂ불규칙/...)，不是完整變化表——
// 規則本身寫死在這裡(封閉、固定的語言系統)，套用在詞目的實際詞幹上即時算出。
// ══════════════════════════════════════════════════════════════════
const JUNGSEONG_HARMONY_A = new Set([0, 8]); // ㅏ, ㅗ 屬於「陽性」母音，其餘為陰性(어)

function hangulDecompose(ch) {
  const code = ch.codePointAt(0);
  if (code < 0xAC00 || code > 0xD7A3) return null;
  const idx = code - 0xAC00;
  return { cho: Math.floor(idx / (21 * 28)), jung: Math.floor((idx % (21 * 28)) / 28), jong: idx % 28 };
}
function hangulCompose(cho, jung, jong) {
  return String.fromCodePoint(0xAC00 + (cho * 21 + jung) * 28 + (jong || 0));
}
function vowelHarmony(jung) { return JUNGSEONG_HARMONY_A.has(jung) ? 'a' : 'eo'; }

// 어간 마지막 음절에 아/어를 결합(모음축약)：規則變化的核心
function conjAttachAE(lastSyll) {
  const d = hangulDecompose(lastSyll);
  if (d.jong !== 0) return lastSyll + (vowelHarmony(d.jung) === 'a' ? '아' : '어');
  switch (d.jung) {
    case 0: case 4: case 1: case 5: case 2: case 6: case 3: case 7: return lastSyll; // 아/어/애/에/야/여/얘/예 - 축約(변화없음)
    case 8: return hangulCompose(d.cho, 9, 0);   // 오+아->와
    case 13: return hangulCompose(d.cho, 14, 0); // 우+어->워
    case 20: return hangulCompose(d.cho, 6, 0);  // 이+어->여
    case 11: return hangulCompose(d.cho, 10, 0); // 되(ㅚ)+어->돼(ㅙ)
    default: return lastSyll + (vowelHarmony(d.jung) === 'a' ? '아' : '어');
  }
}

// 替換型敬語(suppletive honorific) 例外清單：這些字的敬語不是規則的-(으)시-附加，
// 而是整個換成不同的字(如 먹다->잡수시다/드시다)，引擎不自動產生，避免產生像
// 「먹으시다」這種實際上不存在的字；改由字典編輯手動用相關詞連結處理。
const CONJ_SUPPLETIVE_HONORIFIC = new Set(['자다', '먹다', '마시다', '죽다', '말하다', '있다', '아프다']);

// 試算表「動詞變化」欄位實際存的代碼，跟網站顯示的分類代碼(01~10)不是同一套——
// 有些分類在試算表裡依母音陰陽等細節再拆成好幾個子代碼(例如01規則拆成1C+/1C1V+/...)，
// 這裡統一轉換成顯示代碼再往後處理。09(푸다)目前改分類進[敬語]，因為푸다不在收錄詞彙內。
const CONJ_RAW_CODE_MAP = {
  '1C+': '01', '1C-': '01',
  '1V+': '01', '1V-': '01', '1V2': '01', '1V3+': '01', '1V3-': '01', '1V4-': '01',
  '2+': '02', '2-': '02',
  '3+': '03', '3-': '03',
  '4': '04',
  '5': '05',
  '6+': '06', '6-': '06',
  '7+': '07', '7-': '07',
  '8+': '08', '8-': '08',
  '9': '09',
  '10': '10',
};
function normalizeConjClass(raw) {
  raw = (raw || '').trim();
  if (!raw) return '';
  return CONJ_RAW_CODE_MAP[raw] || raw; // 對照不到的先原樣返回，避免資料格式微調時整個消失
}

// ══════════════════════════════════════════════════════════════════
// 各分類代碼專用的完整變化表引擎 —— 已逐格跟使用者核對過範例詞正確無誤。
// 畫面展開表格、精確搜尋反查索引，兩者都共用同一套(見下方 buildDetailedConjugationTable)，
// 避免兩邊各自維護一套規則、之後又長歪不一致。
// ══════════════════════════════════════════════════════════════════
const CONJ_DETAILED_CLASSES = new Set(['01', '02', '03', '04', '05', '06', '07', '08', '09', '10']);

function mergeJongseong(root, jongIdx) {
  const syll = [...root];
  const last = syll[syll.length - 1];
  const d = hangulDecompose(last);
  return syll.slice(0, -1).join('') + hangulCompose(d.cho, d.jung, jongIdx);
}

// 01류(規則) 어근 계산：詞根1=원형, 詞根2=원형+으(자음 어간만), 詞根3=핵심형(모음축약)
function computeRoots01(stem) {
  const d = hangulDecompose(stem[stem.length - 1]);
  const root2 = stem + (d.jong !== 0 ? '으' : '');
  const root3 = stem.slice(0, -1) + conjAttachAE(stem[stem.length - 1]);
  return { root1: stem, root2, root3 };
}
// 02류(으탈락) 어근 계산：詞根1=詞根2=원형, 詞根3=으탈락+아/어
// (앞 음절이 陽/母音이면 아, 陰/母音이거나 앞에 음절이 없으면 어——由詞根本身自動判斷，不需另外分+/-)
function computeRoots02(stem) {
  const syll = [...stem];
  const last = syll[syll.length - 1];
  const d = hangulDecompose(last);
  const prefix = syll.slice(0, -1).join('');
  const prevSyll = syll.length > 1 ? syll[syll.length - 2] : null;
  const h = prevSyll ? vowelHarmony(hangulDecompose(prevSyll).jung) : 'eo';
  const root3 = prefix + hangulCompose(d.cho, h === 'a' ? 0 : 4, 0);
  return { root1: stem, root2: stem, root3 };
}
// 03류(ㅂ換ㅜ) 어근 계산：詞根2固定用우；詞根3依「單音節+陽性調」自動判斷用오(돕다/곱다例外)或우(一般)，
// 不需要額外傳入+/-代碼——規則本身(單音節且陽性調)已經能唯一決定，跟class code的+/-標記結果一致
function computeRoots03(stem) {
  const d = hangulDecompose(stem[stem.length - 1]);
  const prefix = stem.slice(0, -1);
  const base = hangulCompose(d.cho, d.jung, 0);
  const root2 = prefix + base + hangulCompose(11, 13, 0);
  const isMonosyllable = [...stem].length === 1;
  const isPositiveHarmony = (d.jung === 0 || d.jung === 8);
  const useOException = isMonosyllable && isPositiveHarmony;
  const root3Syll = hangulCompose(11, useOException ? 8 : 13, 0);
  const root3 = prefix + base + conjAttachAE(root3Syll);
  return { root1: stem, root2, root3 };
}
// 04류(ㄷ換ㄹ) 어근 계산：詞根1=원형, 詞根2=ㄷ->ㄹ+으, 詞根3=ㄷ->ㄹ+아/어(핵심형)
function computeRoots04(stem) {
  const d = hangulDecompose(stem[stem.length - 1]);
  const prefix = stem.slice(0, -1);
  const transformed = prefix + hangulCompose(d.cho, d.jung, 8);
  const root2 = transformed + '으';
  const root3 = transformed + (vowelHarmony(d.jung) === 'a' ? '아' : '어');
  return { root1: stem, root2, root3 };
}
// 05류(ㅅ落鈎) 어근 계산：詞根1=원형, 詞根2=ㅅ제거+으, 詞根3=ㅅ제거+아/어(단순접속，不經過母音縮寫)
function computeRoots05(stem) {
  const d = hangulDecompose(stem[stem.length - 1]);
  const prefix = stem.slice(0, -1);
  const base = prefix + hangulCompose(d.cho, d.jung, 0);
  const root2 = base + '으';
  const root3 = base + (vowelHarmony(d.jung) === 'a' ? '아' : '어');
  return { root1: stem, root2, root3 };
}
// 07류(ㄹ落鈎) 어근 계산：詞根1=원형(保留ㄹ), 詞根2=ㄹ去掉, 詞根3=원형+아/어(保留ㄹ)。
// 這一類需要額外的例外規則(見下方 lTalrak 標記處理)，因為ㄴ/ㅂ/ㅅ開頭語尾會觸發ㄹ탈락(用詞根2)，
// 名詞化-ㅁ更會跟既有的ㄹ合併成겹받침(ㄻ)，不是單純換掉收尾音。
function computeRoots07(stem) {
  const d = hangulDecompose(stem[stem.length - 1]);
  const prefix = stem.slice(0, -1);
  const root2 = prefix + hangulCompose(d.cho, d.jung, 0);
  const root3 = stem + (vowelHarmony(d.jung) === 'a' ? '아' : '어');
  return { root1: stem, root2, root3 };
}
// 08류(ㅎ落鈎) 어근 계산：詞根1=원형, 詞根2=ㅎ去掉, 詞根3=ㅎ去掉+母音改為ㅐ/ㅒ(ㅏ/ㅓ->ㅐ, ㅑ->ㅒ)
function computeRoots08(stem) {
  const d = hangulDecompose(stem[stem.length - 1]);
  const prefix = stem.slice(0, -1);
  const root2 = prefix + hangulCompose(d.cho, d.jung, 0);
  const vowelMap = { 0: 1, 4: 1, 2: 3 };
  const newJung = vowelMap[d.jung] !== undefined ? vowelMap[d.jung] : 1;
  const root3 = prefix + hangulCompose(d.cho, newJung, 0);
  return { root1: stem, root2, root3 };
}
// 09류(敬語 -시다 어간) 어근 계산：詞根1=詞根2=원형(-시), 詞根3=핵심형(-셔, 이+어->여 축약)
function computeRoots09(stem) {
  const root3 = stem.slice(0, -1) + conjAttachAE(stem[stem.length - 1]);
  return { root1: stem, root2: stem, root3 };
}
// 06류(르重複) 어근 계산：詞根1=詞根2=원형(르 그대로), 詞根3=르 앞 음절에 ㄹ받침 추가 + 라/러
// (르 앞 음절 자체의 陰陽에 따라 결정, 르 자신의 모음이 아님)
function computeRoots06(stem) {
  const syll = [...stem];
  const prevSyll = syll[syll.length - 2];
  const pd = hangulDecompose(prevSyll);
  const h = vowelHarmony(pd.jung);
  const prevWithL = hangulCompose(pd.cho, pd.jung, 8);
  const newSyll = hangulCompose(5, h === 'a' ? 0 : 4, 0);
  const root3 = syll.slice(0, -2).join('') + prevWithL + newSyll;
  return { root1: stem, root2: stem, root3 };
}
// 10류(하다) 어근 계산：詞根1=詞根2=원형(하), 詞根3=핵심형(해)
function computeRoots10(stem) {
  return { root1: stem, root2: stem, root3: stem.slice(0, -1) + '해' };
}
const CONJ_ROOT_COMPUTERS = {
  '01': computeRoots01, '02': computeRoots02, '03': computeRoots03,
  '04': computeRoots04, '05': computeRoots05, '06': computeRoots06,
  '07': computeRoots07, '08': computeRoots08, '09': computeRoots09, '10': computeRoots10,
};

// 各分類的例外設定：請誘/命令有無、以及(僅09)非過去禮貌형改用세요、(僅07)ㄹ탈락觸發規則
const CONJ_CLASS_CONFIG = {
  '01': { hasProp: pos => pos === '動', hasCmdFormal: pos => pos === '動', hasCmdIntimate: pos => pos === '動' },
  '02': { hasProp: pos => pos === '動', hasCmdFormal: pos => pos === '動', hasCmdIntimate: pos => pos === '動' },
  '03': { hasProp: pos => pos === '動', hasCmdFormal: pos => pos === '動', hasCmdIntimate: pos => pos === '動' },
  '04': { hasProp: pos => pos === '動', hasCmdFormal: pos => pos === '動', hasCmdIntimate: pos => pos === '動' },
  '05': { hasProp: pos => pos === '動', hasCmdFormal: pos => pos === '動', hasCmdIntimate: pos => pos === '動' },
  '06': { hasProp: pos => pos === '動', hasCmdFormal: pos => pos === '動', hasCmdIntimate: pos => pos === '動' },
  '08': { hasProp: pos => pos === '動', hasCmdFormal: pos => pos === '動', hasCmdIntimate: pos => pos === '動' },
  '10': { hasProp: pos => pos === '動', hasCmdFormal: pos => pos === '動', hasCmdIntimate: pos => pos === '動' },
  // 09：動詞也沒有請誘；命令只有禮貌有、親近沒有；非過去的禮貌형用「詞根1去掉最後一字+세요」，不是詞根3+요
  '09': {
    hasProp: () => false, hasCmdFormal: pos => pos === '動', hasCmdIntimate: () => false,
    politeNonPastOverride: (root1) => [...root1].slice(0, -1).join('') + '세요',
  },
  // 07：詞根1固定帶ㄹ收尾，但ㄴ/ㅂ/ㅅ開頭語尾會觸發ㄹ탈락——凡是原本該用詞根1的「子音開頭語尾」，
  // 只要該語尾第一個字母是ㄴ/ㅂ/ㅅ，就要改用詞根2；名詞化-ㅁ更要跟既有ㄹ合成겹받침(ㄻ)。
  '07': { hasProp: pos => pos === '動', hasCmdFormal: pos => pos === '動', hasCmdIntimate: pos => pos === '動', lTalrak: true },
};

// 把詞根部分用透明底色標示出來(依詞根1/2/3給不同色階)，後方語尾維持原狀不加底色
function conjMark(root, rootNum, suffix) {
  return `<span class="conj-root conj-root-${rootNum}">${escapeHtml(root)}</span>${escapeHtml(suffix || '')}`;
}
// 語尾會跟詞根最後一個音節合併(當收尾音)的情況：合併後的音節仍算詞根範圍
function conjMarkMerge(root, rootNum, jongIdx, suffixAfter) {
  return conjMark(mergeJongseong(root, jongIdx), rootNum, suffixAfter);
}

// 完整變化表：依詞類(動/形)+分類例外設定決定要不要含請誘/命令/冠形詞過去/目的等欄位
function buildDetailedConjugationTable(roots, pos, cfg) {
  const { root1, root2, root3 } = roots;
  const j1 = hangulDecompose(root1[root1.length - 1]).jong;
  const isVerb = pos === '動';
  const hasProp = cfg.hasProp(pos), hasCmdFormal = cfg.hasCmdFormal(pos), hasCmdIntimate = cfg.hasCmdIntimate(pos);
  const lTalrak = !!cfg.lTalrak; // 07類：詞根1固定帶ㄹ，但ㄴ/ㅂ/ㅅ開頭語尾要改用詞根2(ㄹ已脫落)
  // 冠形詞現在：動詞用「詞根1+는」(07類例外改用詞根2，因為-는以ㄴ開頭觸發ㄹ탈락)，形容詞用「詞根2+ㄴ(合併)」
  const gwanhyeongPresent = isVerb
    ? (lTalrak ? conjMark(root2, 2, '는') : conjMark(root1, 1, '는'))
    : conjMarkMerge(root2, 2, 4, '');
  // 禮貌·非過去(平敍/疑問/命令共用同一個해요체形)：一般情況是詞根3+요，09類例外改用세요
  const politeNonPast = cfg.politeNonPastOverride ? cfg.politeNonPastOverride(root1) : conjMark(root3, 3, '요');
  // ㅂ니다/습니다：一般看詞根1有沒有收尾音；07類固定用詞根2+ㅂ니다(因為니다以ㄴ開頭，ㄹ탈락)
  const formalNida = lTalrak
    ? conjMarkMerge(root2, 2, 17, '니다')
    : (j1 === 0 ? conjMarkMerge(root1, 1, 17, '니다') : conjMark(root1, 1, '습니다'));
  const formalNikka = lTalrak
    ? conjMarkMerge(root2, 2, 17, '니까')
    : (j1 === 0 ? conjMarkMerge(root1, 1, 17, '니까') : conjMark(root1, 1, '습니까'));

  const t = {};
  t['禮貌_平敍_非過去_비'] = politeNonPast;
  t['禮貌_平敍_非過去_정'] = formalNida;
  t['禮貌_平敍_過去_비'] = conjMarkMerge(root3, 3, 20, '어요');
  t['禮貌_平敍_過去_정'] = conjMarkMerge(root3, 3, 20, '습니다');
  t['禮貌_疑問_非過去_비'] = politeNonPast;
  t['禮貌_疑問_非過去_정'] = formalNikka;
  t['禮貌_疑問_過去_비'] = conjMarkMerge(root3, 3, 20, '어요');
  t['禮貌_疑問_過去_정'] = conjMarkMerge(root3, 3, 20, '습니까');
  t['禮貌_推測_비'] = conjMark(root1, 1, '겠어요');
  t['禮貌_推測_정'] = conjMark(root1, 1, '겠습니다');
  if (hasCmdFormal) {
    t['禮貌_命令_비'] = politeNonPast;
    t['禮貌_命令_정'] = conjMarkMerge(root2, 2, 17, '시오');
  }
  if (hasProp) {
    t['禮貌_請誘_비'] = conjMark(root3, 3, '요');
    t['禮貌_請誘_정'] = conjMark(root2, 2, '십시다');
  }
  t['親近_平敍_非過去_비'] = conjMark(root3, 3, '');
  // 는다：以ㄴ開頭，07類動詞觸發ㄹ탈락改用詞根2；其餘依詞根1收尾音決定用哪種合併方式
  t['親近_平敍_非過去_정'] = isVerb
    ? (lTalrak ? conjMarkMerge(root2, 2, 4, '다') : (j1 === 0 ? conjMarkMerge(root1, 1, 4, '다') : conjMark(root1, 1, '는다')))
    : conjMark(root1, 1, '다');
  t['親近_平敍_過去_비'] = conjMarkMerge(root3, 3, 20, '어');
  t['親近_平敍_過去_정'] = conjMarkMerge(root3, 3, 20, '다');
  t['親近_疑問_非過去_비'] = conjMark(root3, 3, '');
  // 詞根1+느냐(動詞) / 詞根2+냐(形容詞)——느냐是子音開頭語尾，07類動詞例外要用詞根2(ㄹ탈락)
  t['親近_疑問_非過去_정'] = isVerb
    ? (lTalrak ? conjMark(root2, 2, '느냐') : conjMark(root1, 1, '느냐'))
    : conjMark(root2, 2, '냐');
  t['親近_疑問_過去_비'] = conjMarkMerge(root3, 3, 20, '어');
  t['親近_疑問_過去_정'] = conjMarkMerge(root3, 3, 20, '느냐');
  t['親近_推測_비'] = conjMark(root1, 1, '겠어');
  t['親近_推測_정'] = conjMark(root1, 1, '겠다');
  if (hasCmdIntimate) {
    t['親近_命令_비'] = conjMark(root3, 3, '');
    t['親近_命令_정'] = conjMark(root3, 3, '라');
  }
  if (hasProp) {
    t['親近_請誘_비'] = conjMark(root3, 3, '');
    t['親近_請誘_정'] = conjMark(root1, 1, '자');
  }
  t['連結_對等補助'] = conjMark(root1, 1, '고');
  // 從屬·原因：兩兩一組同一行呈現(詞根3系列一行、詞根2+니系列一行)，不是四個全部擠在一起
  t['連結_從屬_原因'] = [
    [conjMark(root3, 3, ''), conjMark(root3, 3, '서')],
    [conjMark(root2, 2, '니'), conjMark(root2, 2, '니까')],
  ];
  t['連結_從屬_對比'] = [conjMark(root1, 1, '지만'), gwanhyeongPresent + '데', conjMark(root1, 1, '더니')];
  // 면(ㅁ開頭)、려고(ㄹ開頭) 都不是ㄴ/ㅂ/ㅅ開頭，不會觸發07類的ㄹ탈락，所以07類要用詞根1(保留ㄹ)
  t['連結_從屬_條件'] = [lTalrak ? conjMark(root1, 1, '면') : conjMark(root2, 2, '면'), conjMark(root3, 3, '야')];
  if (isVerb) t['連結_從屬_目的'] = lTalrak ? conjMark(root1, 1, '려고') : conjMark(root2, 2, '려고');
  // 名詞化非過去第一項：一般是詞根2+ㅁ合併；07類要用詞根1既有的ㄹ跟ㅁ合成겹받침(ㄻ)，不是詞根2
  const myeongsaBiUngeo = lTalrak ? conjMarkMerge(root1, 1, 10, '') : conjMarkMerge(root2, 2, 16, '');
  t['轉成_名詞_非過去'] = [[myeongsaBiUngeo, conjMark(root1, 1, '기')]];
  t['轉成_名詞_過去'] = [[conjMarkMerge(root3, 3, 20, '음'), conjMarkMerge(root3, 3, 20, '기')]];
  if (isVerb) t['轉成_冠形詞_過去'] = conjMarkMerge(root2, 2, 4, '');
  t['轉成_冠形詞_現在'] = gwanhyeongPresent;
  t['轉成_冠形詞_未來'] = conjMarkMerge(root2, 2, 8, '');
  return t;
}

// 左欄放「終結」(內容最多)，右欄放「連結」+「轉成」(內容較少)——
// 這樣兩欄各自獨立由上往下讀完，不會有「往右移又要往上找對應分類」的閱讀問題。
// 命令排在請誘上方(依使用頻率調整過的順序)。
const CONJ_LEFT_SECTIONS = [
  { title: '終結·禮貌', rows: [
    ['平敍·非過去', '禮貌_平敍_非過去_비', '禮貌_平敍_非過去_정'],
    ['平敍·過去', '禮貌_平敍_過去_비', '禮貌_平敍_過去_정'],
    ['疑問·非過去', '禮貌_疑問_非過去_비', '禮貌_疑問_非過去_정'],
    ['疑問·過去', '禮貌_疑問_過去_비', '禮貌_疑問_過去_정'],
    ['推測', '禮貌_推測_비', '禮貌_推測_정'],
    ['命令', '禮貌_命令_비', '禮貌_命令_정'],
    ['請誘', '禮貌_請誘_비', '禮貌_請誘_정'],
  ]},
  { title: '終結·親近', rows: [
    ['平敍·非過去', '親近_平敍_非過去_비', '親近_平敍_非過去_정'],
    ['平敍·過去', '親近_平敍_過去_비', '親近_平敍_過去_정'],
    ['疑問·非過去', '親近_疑問_非過去_비', '親近_疑問_非過去_정'],
    ['疑問·過去', '親近_疑問_過去_비', '親近_疑問_過去_정'],
    ['推測', '親近_推測_비', '親近_推測_정'],
    ['命令', '親近_命令_비', '親近_命令_정'],
    ['請誘', '親近_請誘_비', '親近_請誘_정'],
  ]},
];
const CONJ_RIGHT_SECTIONS = [
  { title: '連結', single: true, rows: [
    ['對等/補助', '連結_對等補助'],
    ['從屬·原因', '連結_從屬_原因'],
    ['從屬·對比', '連結_從屬_對比'],
    ['從屬·條件', '連結_從屬_條件'],
    ['從屬·目的', '連結_從屬_目的'],
  ]},
  { title: '轉成', single: true, rows: [
    ['名詞·非過去', '轉成_名詞_非過去'],
    ['名詞·過去', '轉成_名詞_過去'],
    ['冠形詞·過去', '轉成_冠形詞_過去'],
    ['冠形詞·現在', '轉成_冠形詞_現在'],
    ['冠形詞·未來', '轉成_冠形詞_未來'],
  ]},
];

// 值可能是：純字串／一維陣列(各自換行)／二維陣列(每個子陣列兩個值同一行、陣列間換行，用於「原因」)
function renderConjValue(val) {
  if (!Array.isArray(val)) return val;
  return val.map(v => {
    if (Array.isArray(v)) {
      // 配對值(如「從屬·原因」)：兩欄等寬並排、左對齊，讓不同行的第二欄內容彼此對齊
      return `<div class="conj-value-line conj-value-pair"><span class="conj-pair-item">${v[0]}</span><span class="conj-pair-item">${v[1]}</span></div>`;
    }
    return `<div class="conj-value-line">${v}</div>`;
  }).join('');
}

function renderConjSections(sections, t) {
  let html = '';
  sections.forEach(section => {
    const rows = section.rows.filter(r => t[r[1]] !== undefined);
    if (!rows.length) return;
    html += `<div class="conj-section-title">${escapeHtml(section.title)}</div>`;
    if (section.single) {
      rows.forEach(([label, key]) => {
        html += `<div class="conj-row"><span class="conj-label">${escapeHtml(label)}</span><span class="conj-value">${renderConjValue(t[key])}</span></div>`;
      });
    } else {
      html += `<div class="conj-row conj-row-head"><span class="conj-label"></span><span class="conj-value">非正式</span><span class="conj-value">正式</span></div>`;
      rows.forEach(([label, kInf, kForm]) => {
        html += `<div class="conj-row"><span class="conj-label">${escapeHtml(label)}</span><span class="conj-value">${t[kInf]}</span><span class="conj-value">${t[kForm]}</span></div>`;
      });
    }
  });
  return html;
}

function renderDetailedConjugationTable(word, cls, pos) {
  if (!word.endsWith('다')) return '<div class="conj-empty">無法計算變化表</div>';
  const stem = word.slice(0, -1);
  const rootFn = CONJ_ROOT_COMPUTERS[cls];
  const cfg = CONJ_CLASS_CONFIG[cls];
  if (!rootFn || !cfg) return '<div class="conj-empty">此分類尚未設定變化規則</div>';
  const roots = rootFn(stem);
  const t = buildDetailedConjugationTable(roots, pos, cfg);
  const html = renderConjSections([...CONJ_LEFT_SECTIONS, ...CONJ_RIGHT_SECTIONS], t);
  return `<div class="conj-table-inner conj-table-detailed"><div class="conj-col">${html}</div></div>`;
}

function renderConjugationTable(word, cls, pos) {
  if (CONJ_DETAILED_CLASSES.has(cls)) {
    return renderDetailedConjugationTable(word, cls, pos);
  }
  return '<div class="conj-empty">此分類尚未設定變化規則</div>';
}

let _conjPanelOpenKey = null;
function toggleConjPanel(key, word, cls, pos) {
  const panel = document.getElementById('conjPanel');
  const overlay = document.getElementById('conjPanelOverlay');
  if (_conjPanelOpenKey === key) {
    closeConjPanel();
    return;
  }
  panel.innerHTML = `<div class="conj-panel-header"><span>${escapeHtml(word)}（${escapeHtml(cls)}）動詞變化</span>`
    + `<button class="conj-panel-close" onclick="closeConjPanel()">✕</button></div>`
    + `<div class="conj-panel-body">${renderConjugationTable(word, cls, pos)}</div>`;
  panel.classList.add('show');
  overlay.classList.add('show');
  _conjPanelOpenKey = key;
}
function closeConjPanel() {
  document.getElementById('conjPanel').classList.remove('show');
  document.getElementById('conjPanelOverlay').classList.remove('show');
  _conjPanelOpenKey = null;
}

function renderWordWithAffix(word) {
  const { lead, core, trail } = splitAffixDashes(word || '');
  const leadHtml = lead ? `<span class="affix-dash">${escapeHtml(lead)}</span>` : '';
  const trailHtml = trail ? `<span class="affix-dash">${escapeHtml(trail)}</span>` : '';
  return leadHtml + escapeHtml(core) + trailHtml;
}

async function loadData() {
  try {
    const [lemmataText, sensesText, etymologyText, examplesText] = await Promise.all([
      fetch(LEMMATA_URL, { cache: 'no-cache' }).then(r => r.text()),
      fetch(SENSES_URL, { cache: 'no-cache' }).then(r => r.ok ? r.text() : ''),
      fetch(ETYMOLOGY_URL, { cache: 'no-cache' }).then(r => r.ok ? r.text() : ''),
      fetch(EXAMPLES_URL, { cache: 'no-cache' }).then(r => r.ok ? r.text() : '')
    ]);

    // ── Lemmata ──（韓語版無方言別、無ne欄，改為 發音 欄）
    const lem = parseCSV(lemmataText);
    const idxId = lem.headers.indexOf('編號');
    const idxWord = lem.headers.indexOf('詞語');
    const idxPron = lem.headers.indexOf('發音');
    const idxAudio = lem.headers.indexOf('音檔');

    entries = lem.rows.map(cols => {
      const word = (cols[idxWord] || '').trim();
      const id = (cols[idxId] || '').trim();
      return {
        id,
        word,
        pron: (cols[idxPron] || '').trim(),
        letter: firstLetter(word),
        ne: false,
        dial: '', // 韓語辭典無方言別概念，固定為空字串（底層架構跟其他辭典保持一致）
        audioFile: (cols[idxAudio] || '').trim()
      };
    }).filter(e => e.word);

    // 排序：依編號
    entries.sort((a, b) => parseInt(a.id, 10) - parseInt(b.id, 10));

    // lemmataById 用「編號_方言別」組合鍵（方言別固定空字串，等同純編號）
    lemmataById = {};
    entries.forEach(e => { if (e.id) lemmataById[lemmaKey(e.id, e.dial)] = e; });

    // ── Senses ── 同樣用「編號_方言別」組合鍵，避免跨方言資料混在一起
    sensesByLemma = {};
    const categorySet = new Set();
    if (sensesText) {
      const sn = parseCSV(sensesText);
      const senseObjs = rowsToObjects(sn.headers, sn.rows);
      senseObjs.forEach(s => {
        const id = s['編號'];
        const dial = ''; // 韓語版無方言別
        if (!id) return;
        (sensesByLemma[lemmaKey(id, dial)] = sensesByLemma[lemmaKey(id, dial)] || []).push(s);
        const cat = (s['分類'] || '').trim();
        if (cat) categorySet.add(cat);
      });
    }
    ALL_CATEGORIES = [...categorySet].sort();
    selectedCategories = new Set(ALL_CATEGORIES); // 預設全部勾選

    // ── 動詞變化反向索引 ── 詞類為動/形、且填了「動詞變化」分組代碼的義項，
    // 用跟畫面展開表格「同一套」引擎算出完整變化表(單一事實來源，避免兩邊規則以後又長歪)，
    // 把每一個衍生形都記進反查索引，供精確搜尋連回原詞根。
    conjugatedFormsIndex = {};
    Object.values(sensesByLemma).forEach(senseArr => {
      senseArr.forEach(s => {
        const pos = (s['詞類'] || '').trim();
        const cls = normalizeConjClass(s['動詞變化']);
        if (!cls || (pos !== '動' && pos !== '形') || !CONJ_DETAILED_CLASSES.has(cls)) return;
        const lemma = lemmataById[lemmaKey(s['編號'], '')];
        if (!lemma || !lemma.word.endsWith('다')) return;
        const rootFn = CONJ_ROOT_COMPUTERS[cls];
        const cfg = CONJ_CLASS_CONFIG[cls];
        if (!rootFn || !cfg) return;
        let table;
        try { table = buildDetailedConjugationTable(rootFn(lemma.word.slice(0, -1)), pos, cfg); }
        catch (e) { return; }
        const addForm = raw => {
          const clean = raw.replace(/<[^>]+>/g, '').trim(); // 去掉詞根底色的<span>標記，只留純文字
          if (!clean) return;
          if (!conjugatedFormsIndex[clean]) conjugatedFormsIndex[clean] = new Set();
          conjugatedFormsIndex[clean].add(s['編號']);
        };
        Object.values(table).forEach(val => {
          if (!val) return;
          if (Array.isArray(val)) {
            val.forEach(v => Array.isArray(v) ? v.forEach(addForm) : addForm(v));
          } else {
            addForm(val);
          }
        });
      });
    });

    // ── 派生詞反向索引 ──（先只處理指向本詞典詞目的純數字語源，Etymology.csv 代碼先不處理）
    // 掃描每一個義項的[語源]欄位，把「A的語源是B」反過來記成「B的派生詞包含A」。
    // 沒有 #義項編號 的引用：記在詞目層級（顯示在整個詞目最下方）。
    // 有 #義項編號 的引用：記在該義項層級（顯示在該義項底下，位置對齊近/反義詞）。
    // + 號連接的多個語源，每一段都各自獨立檢查、獨立計入。
    // 記錄的是「引用詞目+引用義項」的配對(不是只記引用詞目)，
    // 這樣渲染時才能只取真正相關的那個義項翻譯，不會把引用詞目底下其他不相關的義項也混進來。
    derivedWordsByLemma = {};
    derivedWordsBySense = {};
    Object.values(sensesByLemma).forEach(senseArr => {
      senseArr.forEach(s => {
        const raw = (s['語源'] || '').trim();
        if (!raw) return;
        const dial = ''; // 韓語版無方言別
        const citingId = s['編號'];
        const citingSenseId = s['義項'];
        if (!citingId) return;
        const citingEntry = citingId + '#' + citingSenseId;
        raw.split('|').forEach(group => {
          group.split('+').forEach(tokRaw => {
            const tok = tokRaw.trim();
            const m = tok.match(/^(\d{1,7}(?:\.\d+)?)(?:#(\d+(?:\.\d+)?))?$/); // 純數字(可帶小數點的暫時編號)，可選 #義項編號
            if (!m) return; // 排除拉丁字母+數字(Etymology.csv代碼)
            const targetId = m[1];
            const targetSenseId = m[2];
            if (targetId === citingId) return; // 理論上不會指向自己，保險起見排除
            if (targetSenseId) {
              const key = lemmaKey(targetId, dial) + '_' + targetSenseId;
              if (!derivedWordsBySense[key]) derivedWordsBySense[key] = new Set();
              derivedWordsBySense[key].add(citingEntry);
            } else {
              const key = lemmaKey(targetId, dial);
              if (!derivedWordsByLemma[key]) derivedWordsByLemma[key] = new Set();
              derivedWordsByLemma[key].add(citingEntry);
            }
          });
        });
      });
    });

    // ── Etymology ──
    etymologyByCode = {};
    if (etymologyText) {
      const et = parseCSV(etymologyText);
      const etyObjs = rowsToObjects(et.headers, et.rows);
      etyObjs.forEach(row => {
        const code = row['編號'];
        if (code) etymologyByCode[code] = row;
      });
    }

    // ── Examples ── 用「詞目編號_義項編號」組合鍵，因為義項編號本身並非全域唯一
    // （不同詞目可能剛好意思相同、被分配到同樣的義項編號）
    examplesBySense = {};
    if (examplesText) {
      const ex = parseCSV(examplesText);
      const exObjs = rowsToObjects(ex.headers, ex.rows);
      exObjs.forEach(row => {
        const senseId = row['義項'];
        const lemId = row['編號'];
        if (!senseId || !lemId) return;
        const key = lemId + '_' + senseId;
        (examplesBySense[key] = examplesBySense[key] || []).push(row);
      });
    }

    buildSidebar();
    renderContent();
    layoutLetterGrids();
  } catch (err) {
    document.getElementById('content').innerHTML =
      '<div class="empty"><div class="empty-icon">⚠</div><div>資料載入失敗，請確認 data 資料夾內的 csv 是否存在</div></div>';
  }
}

// ── Grid layout: same-row entries share equal height, row-first fill (left→right) ──
// 效能重點：先「只讀一次」共用容器的寬度，再統一「只寫」所有 letter-group 的樣式。
// 舊寫法對每個 letter-group 各自讀取 clientWidth 又緊接著寫入樣式，在含有上萬個節點的
// 大型頁面裡，每次讀取都會強迫瀏覽器同步重新計算整份版面(layout thrashing)，
// 20多組輪流讀寫下來就是明顯的卡頓來源。
function layoutLetterGrids() {
  const groups = document.querySelectorAll('.letter-group');
  if (!groups.length) return;
  const content = document.getElementById('content');
  const width = (content && content.clientWidth) || 1000;
  const naturalColumns = Math.max(1, Math.floor(width / 340));
  groups.forEach(group => {
    // 每組欄數不要超過該組本身的項目數，避免項目很少時（例如搜尋結果只有1-2筆）
    // 網格還是切出跟平常瀏覽一樣多欄，導致卡片被拉得很窄、旁邊留一堆空白欄位。
    const cols = Math.max(1, Math.min(naturalColumns, group.children.length || 1));
    group.style.gridAutoFlow = 'row';
    group.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
  });
  fixTermHighlightLineStarts();
}

// 例句/翻譯裡的關鍵字highlight，前後都有間距；但如果剛好落在一行最前方
// （不管是句首、還是文字換行造成的），要取消跟左邊的間距，讓文字對齊其他行。
// 判斷方式：直接檢查這個標記「前面緊鄰的文字」是否跟它同一行——
// 用 Range API 量出前一個字元的實際位置，比對兩者的垂直位置(top)是否相同。
// 不能用「跟容器左邊界比對」，因為容器本身的版面結構不一定跟文字實際起始點對齊，
// 這也是先前造成「不到」這種非行首詞彙被誤判成行首的原因。
//
// 效能重點：先把「所有標記」都讀取完位置、判斷好結果，全部讀完之後才「統一寫入」樣式。
// 一頁詞條量大時，例句關鍵字標記可能有數千個，如果每個標記都是「讀取→馬上寫入」交錯進行，
// 每次寫入都會讓瀏覽器下一次讀取被迫重新計算整份版面（layout thrashing），
// 這是初次載入卡頓的主要原因；讀寫分成兩階段後，讀取階段可以共用同一份版面結果。
function fixTermHighlightLineStarts() {
  const updates = [];
  document.querySelectorAll('.example-sentence, .example-trans').forEach(container => {
    container.querySelectorAll('.term-highlight').forEach(span => {
      let isLineStart = true;
      const prev = span.previousSibling;
      try {
        if (prev && prev.nodeType === Node.TEXT_NODE) {
          const text = prev.textContent;
          const len = text.replace(/\s+$/, '').length; // 忽略前一個節點尾端的空白
          if (len > 0) {
            const range = document.createRange();
            range.setStart(prev, len - 1);
            range.setEnd(prev, len);
            const prevRect = range.getBoundingClientRect();
            const spanRect = span.getBoundingClientRect();
            if (prevRect.width > 0 && Math.abs(prevRect.top - spanRect.top) < 2) {
              isLineStart = false; // 前面還有文字在同一行
            }
          }
        } else if (prev && prev.getBoundingClientRect) {
          const prevRect = prev.getBoundingClientRect();
          const spanRect = span.getBoundingClientRect();
          if (Math.abs(prevRect.top - spanRect.top) < 2) {
            isLineStart = false;
          }
        }
      } catch (e) { /* Range 若失敗就保守當作非行首，維持原本間距 */ isLineStart = false; }
      updates.push({ span, isLineStart });
    });
  });
  // 全部讀取完成後才統一寫入，避免讀寫交錯
  updates.forEach(({ span, isLineStart }) => {
    span.style.marginLeft = isLineStart ? '0' : '';
  });
}

let _resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(layoutLetterGrids, 150);
});

function entryPassesLevelFilter(e) {
  if (selectedLevels.size >= LEVELS.length) return true; // 全選 = 不篩選
  const senses = sensesByLemma[lemmaKey(e.id, e.dial)];
  if (!senses || !senses.length) return false;
  return senses.some(s => selectedLevels.has((s['等級'] || '').trim()));
}

function entryPassesCategoryFilter(e) {
  if (selectedCategories.size >= ALL_CATEGORIES.length) return true; // 全選 = 不篩選
  const senses = sensesByLemma[lemmaKey(e.id, e.dial)];
  if (!senses || !senses.length) return false;
  return senses.some(s => selectedCategories.has((s['分類'] || '').trim()));
}

function getVisibleEntries() {
  let result = entries;
  if (selectedLevels.size < LEVELS.length) {
    result = result.filter(entryPassesLevelFilter);
  }
  if (selectedCategories.size < ALL_CATEGORIES.length) {
    result = result.filter(entryPassesCategoryFilter);
  }
  return result;
}

function buildSidebar() {
  const sidebar = document.getElementById('sidebar');

  // 翻譯／羅馬字顯示切換：必展開、不可收合
  let html = `<div class="toggle-group">
    <div class="toggle-label">顯示順序</div>
    <div class="toggle-switch">
      <div class="toggle-option ${transOrder === 'trans' ? 'active' : ''}" onclick="setTransOrder('trans')">漢字優先</div>
      <div class="toggle-option ${transOrder === 'rom' ? 'active' : ''}" onclick="setTransOrder('rom')">羅馬字優先</div>
    </div>
  </div>
  <div class="toggle-group">
    <div class="toggle-label">羅馬字系統</div>
    <div class="toggle-switch">
      <div class="toggle-option ${romSystem === 'TL' ? 'active' : ''}" onclick="setRomSystem('TL')">TL</div>
      <div class="toggle-option ${romSystem === 'POJ' ? 'active' : ''}" onclick="setRomSystem('POJ')">POJ</div>
    </div>
  </div>
  <div class="sb-divider"></div>`;

  html += `<div class="sb-sec-hdr" onclick="toggleAzSection()">
    字母
    <span class="sb-arrow">${azSectionOpen ? '▾' : '▸'}</span>
  </div>`;

  const visible = getVisibleEntries();
  const letters = sortLetters([...new Set(visible.map(e => e.letter))]);
  html += `<div class="az-list ${azSectionOpen ? '' : 'closed'}">` + letters.map(l =>
    `<button class="az-btn ${l === activeLetter ? 'active' : ''}" id="az-${l}" onclick="switchLetter('${l}')">${l}</button>`
  ).join('') + `</div>`;

  html += `<div class="sb-divider"></div>`;
  html += `<div class="sb-sec-hdr" onclick="toggleLevelSection()">
    等級
    <span class="sb-arrow">${levelSectionOpen ? '▾' : '▸'}</span>
  </div>
  <div class="sb-sec-body ${levelSectionOpen ? '' : 'closed'}">
    <div class="sb-all-row ${selectedLevels.size >= LEVELS.length ? 'sel' : ''}" onclick="toggleAllLevels()">
      <div class="sb-chk ${selectedLevels.size >= LEVELS.length ? 'sel' : ''}">${selectedLevels.size >= LEVELS.length ? '✓' : ''}</div>
      <span>全部</span>
    </div>`;
  LEVELS.forEach(lvl => {
    const sel = selectedLevels.has(lvl);
    html += `<div class="sb-l2-item ${sel ? 'sel' : ''}" onclick="toggleLevel('${lvl}')">
      <div class="sb-chk ${sel ? 'sel' : ''}">${sel ? '✓' : ''}</div>
      <span class="level-icons">${LEVEL_ICONS[lvl]}</span>
    </div>`;
  });
  html += `</div>`;

  html += `<div class="sb-divider"></div>`;
  const allCatSel = ALL_CATEGORIES.length > 0 && selectedCategories.size >= ALL_CATEGORIES.length;
  html += `<div class="sb-sec-hdr" onclick="toggleCategorySection()">
    範疇
    <span class="sb-arrow">${categorySectionOpen ? '▾' : '▸'}</span>
  </div>
  <div class="sb-sec-body ${categorySectionOpen ? '' : 'closed'}">
    <div class="sb-all-row ${allCatSel ? 'sel' : ''}" onclick="toggleAllCategories()">
      <div class="sb-chk ${allCatSel ? 'sel' : ''}">${allCatSel ? '✓' : ''}</div>
      <span>全部</span>
    </div>`;
  ALL_CATEGORIES.forEach(cat => {
    const sel = selectedCategories.has(cat);
    html += `<div class="sb-l2-item ${sel ? 'sel' : ''}" onclick="toggleCategory('${cat.replace(/'/g, "\\'")}')">
      <div class="sb-chk ${sel ? 'sel' : ''}">${sel ? '✓' : ''}</div>
      <span>${escapeHtml(cat)}</span>
    </div>`;
  });
  html += `</div>`;

  sidebar.innerHTML = html;
}

function toggleLevelSection() {
  levelSectionOpen = !levelSectionOpen;
  buildSidebar();
}

function toggleLevel(lvl) {
  if (selectedLevels.has(lvl)) selectedLevels.delete(lvl);
  else selectedLevels.add(lvl);
  refreshAfterFilterChange();
}

function toggleAllLevels() {
  if (selectedLevels.size >= LEVELS.length) {
    selectedLevels.clear();
  } else {
    LEVELS.forEach(l => selectedLevels.add(l));
  }
  refreshAfterFilterChange();
}

function toggleCategorySection() {
  categorySectionOpen = !categorySectionOpen;
  buildSidebar();
}

function toggleCategory(cat) {
  if (selectedCategories.has(cat)) selectedCategories.delete(cat);
  else selectedCategories.add(cat);
  refreshAfterFilterChange();
}

function toggleAllCategories() {
  if (selectedCategories.size >= ALL_CATEGORIES.length) {
    selectedCategories.clear();
  } else {
    ALL_CATEGORIES.forEach(c => selectedCategories.add(c));
  }
  refreshAfterFilterChange();
}

function toggleAzSection() {
  azSectionOpen = !azSectionOpen;
  buildSidebar();
}

function setTransOrder(val) {
  transOrder = val;
  refreshAfterFilterChange();
}

function setRomSystem(val) {
  romSystem = val;
  refreshAfterFilterChange();
}

function refreshAfterFilterChange() {
  buildSidebar();
  const content = document.getElementById('content');
  if (content) {
    content.innerHTML = `<div class="empty"><div class="empty-icon">⟳</div><div>更新中…</div></div>`;
  }
  // 延後一個 tick 執行，讓瀏覽器先把「更新中」畫面畫出來，
  // 避免大量資料(如霧台1萬2千多筆)重繪時，畫面看起來像當機。
  setTimeout(() => {
    renderContent();
    layoutLetterGrids();
  }, 20);
}

// ── 搜尋 ──────────────────────────────────────────────
let _searchDebounce = null;

// 撇音符號家族（' ʹ ` ‘）統一正規化為 ’（U+2019），跟資料庫一致後再比對，
// 這樣使用者用鍵盤打一般的直引號 ' 也能搜尋到用 ’ 撰寫的詞條（沿用 indigenous-sos 的做法）。
function normalizeApostrophe(s) {
  return (s || '').replace(/[\u0027\u02B9\u0060\u2018]/g, '\u2019');
}

function onSearchInput() {
  clearTimeout(_searchDebounce);
  const content = document.getElementById('content');
  if (content) {
    content.innerHTML = `<div class="empty"><div class="empty-icon">⟳</div><div>搜尋中…</div></div>`;
  }
  _searchDebounce = setTimeout(() => {
    searchQuery = normalizeApostrophe(document.getElementById('searchInput').value.trim());
    renderContent();
    layoutLetterGrids();
  }, 150);
}

function toggleExact() {
  searchExact = !searchExact;
  const lbl = document.getElementById('scope-exact');
  const chk = document.getElementById('schk-exact');
  if (lbl) lbl.classList.toggle('active', searchExact);
  if (chk) chk.style.color = searchExact ? '' : 'transparent';
  renderContent();
  layoutLetterGrids();
}

function toggleScope(which) {
  // 兩個範圍都可以取消勾選：都未勾選 = 不限範圍 = 同時搜尋詞目與例句
  searchScope[which] = !searchScope[which];
  const key = which === 'lemma' ? 'lemma' : 'example';
  const lbl = document.getElementById('scope-' + key);
  const chk = document.getElementById('schk-' + key);
  if (lbl) lbl.classList.toggle('active', searchScope[which]);
  if (chk) chk.style.color = searchScope[which] ? '' : 'transparent';
  renderContent();
  layoutLetterGrids();
}

function clearSearchFilters() {
  const input = document.getElementById('searchInput');
  if (input) input.value = '';
  searchQuery = '';
  searchExact = false;
  searchScope = { lemma: true, example: true };
  const exLbl = document.getElementById('scope-exact'), exChk = document.getElementById('schk-exact');
  if (exLbl) exLbl.classList.remove('active');
  if (exChk) exChk.style.color = 'transparent';
  ['lemma', 'example'].forEach(k => {
    const lbl = document.getElementById('scope-' + k), chk = document.getElementById('schk-' + k);
    if (lbl) lbl.classList.add('active');
    if (chk) chk.style.color = '';
  });
  renderContent();
  layoutLetterGrids();
}

// 判斷一筆詞目是否符合目前的搜尋條件（詞目掃描詞語+翻譯；例句掃描語句+語句翻譯）
// 判斷單一文字欄位是否符合目前搜尋條件（沿用跟 matchesSearch 一致的精確/寬鬆規則）。
// allowSegments：只給「義項中文翻譯」使用——精確搜尋時，若該翻譯用全形，或；分隔多個意思，
// 各段各自視為一個獨立的精確比對單位（例如「要接近，要靠近」精確搜尋「要接近」也算符合）。
// 族語詞目、例句語句、例句翻譯都不適用這條規則。
function textMatchesQuery(text, allowSegments) {
  if (!searchQuery) return false;
  text = text || '';
  if (searchExact) {
    if (text === searchQuery) return true;
    if (allowSegments) {
      return text.split(/[，；]/).map(p => p.trim()).filter(Boolean).includes(searchQuery);
    }
    return false;
  }
  return text.toLowerCase().includes(searchQuery.toLowerCase());
}

// 把搜尋關鍵字在文字中的出現位置標記起來（搜尋結果專用，跟例句的詞形對照標記是分開的樣式）。
// allowSegments 意義同上，只用於義項中文翻譯的精確搜尋標記。
function highlightSearchTerm(text, term, allowSegments) {
  text = text || '';
  if (!term) return escapeHtml(text);
  if (searchExact) {
    if (text === term) return `<span class="search-hit">${escapeHtml(text)}</span>`;
    if (allowSegments && text.split(/[，；]/).map(p => p.trim()).filter(Boolean).includes(term)) {
      return text.split(/([，；])/).map(tok => {
        if (tok === '，' || tok === '；') return escapeHtml(tok);
        return (tok.trim() === term) ? `<span class="search-hit">${escapeHtml(tok)}</span>` : escapeHtml(tok);
      }).join('');
    }
    return escapeHtml(text);
  }
  const re = new RegExp(escapeRegex(term), 'gi');
  let result = '', lastIndex = 0, m;
  while ((m = re.exec(text)) !== null) {
    result += escapeHtml(text.slice(lastIndex, m.index));
    result += `<span class="search-hit">${escapeHtml(m[0])}</span>`;
    lastIndex = m.index + m[0].length;
    if (m[0].length === 0) { re.lastIndex++; }
  }
  result += escapeHtml(text.slice(lastIndex));
  return result;
}

function matchesSearch(e) {
  if (!searchQuery) return true;
  const noScope = !searchScope.lemma && !searchScope.example;
  const useLemma = noScope || searchScope.lemma;
  const useExample = noScope || searchScope.example;
  const senses = sensesByLemma[lemmaKey(e.id, e.dial)] || [];

  if (useLemma) {
    if (textMatchesQuery(e.word)) return true;
    if (senses.some(s => textMatchesQuery(s['翻譯'], true))) return true;
    // 精確搜尋時，動詞/形容詞的衍生變化形(如가요、가세요)也算命中原詞根
    if (searchExact && conjugatedFormsIndex[searchQuery] && conjugatedFormsIndex[searchQuery].has(e.id)) {
      return true;
    }
  }
  if (useExample) {
    for (const s of senses) {
      const exs = examplesBySense[s['編號'] + '_' + s['義項']] || [];
      for (const ex of exs) {
        if (textMatchesQuery(ex['語句']) || textMatchesQuery(ex['語句翻譯'])) return true;
      }
    }
  }
  return false;
}

// 韓語版音檔欄位本身就是完整外部連結，直接使用，不需要資料夾分流判斷
function audioUrl(e) {
  return e.audioFile || '';
}

function renderLemmaCard(e) {
  const url = audioUrl(e);
  const hasAudio = !!url;
  const wordHtml = searchQuery ? highlightSearchTerm(e.word, searchQuery) : renderWordWithAffix(e.word);
  const cardId = `lemma-${e.id}-${e.dial}`;
  // 發音欄：有的話用[]包起來、跟詞語不同顏色、隔開一點距離；**...**的部分套用跟例句一樣的高亮
  const pronHtml = e.pron ? `<span class="pron-tag">[${highlightTerm(e.pron, '')}]</span>` : '';
  return `<div class="lemma-entry" id="${cardId}">
      <div class="entry-dial-tag">
        <span></span>
        <button class="share-btn" onclick="shareEntryCard(event, '${cardId}')" title="截圖分享"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2"/><path d="M4 16v2a2 2 0 0 0 2 2h2"/><path d="M20 8V6a2 2 0 0 0-2-2h-2"/><path d="M20 16v2a2 2 0 0 1-2 2h-2"/><rect x="7" y="8.5" width="10" height="7" rx="1.3"/><circle cx="12" cy="12" r="1.6"/></svg></button>
      </div>
      <div class="word-row">
        <div class="word-main">${wordHtml}${e.ne ? '<span class="ne-tag">ne</span>' : ''}${pronHtml}</div>
        <button class="play-btn" ${hasAudio ? '' : 'disabled'}
          title="${hasAudio ? '播放音檔' : '無音檔'}"
          onclick="togglePlay('${url.replace(/'/g, "\\'")}', this)">${hasAudio ? '▶' : '—'}</button>
      </div>
      ${renderSenseSection(e.id, e.dial)}
    </div>`;
}

function renderContent() {
  const content = document.getElementById('content');
  const visible = getVisibleEntries();

  if (visible.length === 0) {
    content.innerHTML = `<div class="empty"><div class="empty-icon">—</div><div>目前尚無資料</div></div>`;
    return;
  }

  // 搜尋模式：不受目前分頁字母限制，跨字母顯示所有符合的結果
  if (searchQuery) {
    const allResults = visible.filter(matchesSearch);
    if (!allResults.length) {
      content.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><div>找不到符合「${escapeHtml(searchQuery)}」的結果</div></div>`;
      return;
    }
    const SEARCH_RESULT_CAP = 200;
    const truncated = allResults.length > SEARCH_RESULT_CAP;
    const results = truncated ? allResults.slice(0, SEARCH_RESULT_CAP) : allResults;

    let html = `<div class="content-info">搜尋「<span>${escapeHtml(searchQuery)}</span>」找到 <span>${allResults.length.toLocaleString()}</span> 筆`
      + (truncated ? `，僅顯示前 <span>${SEARCH_RESULT_CAP}</span> 筆（結果過多，請輸入更精確的關鍵字以縮小範圍）` : '')
      + `</div>`;
    let lastLetter = null;
    results.forEach(e => {
      if (e.letter !== lastLetter) {
        if (lastLetter !== null) html += '</div>';
        html += `<div class="letter-hdr">${e.letter.toUpperCase()}</div><div class="letter-group">`;
        lastLetter = e.letter;
      }
      html += renderLemmaCard(e);
    });
    html += '</div>';
    content.innerHTML = html;
    return;
  }

  // 確保 activeLetter 有效（例如切換方言後，原本的字母可能已經沒有資料）
  const availableLetters = sortLetters([...new Set(visible.map(e => e.letter))]);
  if (!activeLetter || !availableLetters.includes(activeLetter)) {
    activeLetter = availableLetters[0];
  }

  const pageEntries = visible.filter(e => e.letter === activeLetter);

  let html = `<div class="content-info"><span>${visible.length.toLocaleString()}</span> 筆詞條 · 目前顯示「<span>${activeLetter.toUpperCase()}</span>」共 ${pageEntries.length.toLocaleString()} 筆</div>`;
  html += `<div class="letter-hdr">${activeLetter.toUpperCase()}</div>`;
  html += `<div class="letter-group">`;
  pageEntries.forEach(e => { html += renderLemmaCard(e); });
  html += `</div>`;
  content.innerHTML = html;
}

// 切換分頁字母：只渲染該字母的詞條，大幅減少單次渲染量
function switchLetter(letter, afterRender) {
  activeLetter = letter;
  if (searchQuery) {
    searchQuery = '';
    const input = document.getElementById('searchInput');
    if (input) input.value = '';
  }
  buildSidebar();
  const content = document.getElementById('content');
  if (content) {
    content.innerHTML = `<div class="empty"><div class="empty-icon">⟳</div><div>載入中…</div></div>`;
  }
  setTimeout(() => {
    renderContent();
    layoutLetterGrids();
    scrollContentToTop();
    if (afterRender) setTimeout(afterRender, 60);
  }, 10);
}

// ── Senses + Etymology rendering ──
// 把用，或；分隔的多重意義字串拆開，同時保留分隔符本身（順序拿來重新組回去用）
function splitPreserve(str) {
  const parts = str.split(/([，；])/);
  const texts = [], delims = [];
  parts.forEach((p, i) => { if (i % 2 === 0) texts.push(p.trim()); else delims.push(p); });
  return { texts, delims };
}

// 翻譯／TL／POJ 組合顯示：依 transOrder 決定翻譯或羅馬字在前，後者放在全形括號內；
// 若某一組的對應片段是空的，代表這個詞只有另一邊，那一項就不用括號。
// transPieceRenderer 可選：讓「翻譯」的每個片段套用額外處理（例如搜尋高亮），羅馬字片段固定純文字。
function combineTransRom(transRaw, romRaw, order, transPieceRenderer, romPieceRenderer) {
  transRaw = (transRaw || '').trim();
  romRaw = (romRaw || '').trim();
  if (!transRaw && !romRaw) return '';
  const t = splitPreserve(transRaw);
  const r = splitPreserve(romRaw);
  const n = Math.max(t.texts.length, r.texts.length);
  const delims = t.delims.length >= r.delims.length ? t.delims : r.delims;
  const units = [];
  for (let i = 0; i < n; i++) {
    const tp = t.texts[i] || '';
    const rp = r.texts[i] || '';
    const tpHtml = tp ? (transPieceRenderer ? transPieceRenderer(tp) : escapeHtml(tp)) : '';
    const rpHtml = rp ? (romPieceRenderer ? romPieceRenderer(rp) : escapeHtml(rp)) : '';
    if (tp && rp) {
      units.push(order === 'trans' ? `${tpHtml}（${rpHtml}）` : `${rpHtml}（${tpHtml}）`);
    } else if (tp) {
      units.push(tpHtml);
    } else if (rp) {
      units.push(rpHtml);
    }
  }
  let result = '';
  units.forEach((u, i) => {
    result += u;
    if (i < units.length - 1) result += (delims[i] || '，');
  });
  return result;
}

// 例句專用：跟義項不同，例句的翻譯/羅馬字是「一整句」，句子裡本來就可能自然出現逗號、分號
// (單純標點符號，不是多重意義的分隔)，所以不能拆開比對，要整句當成一個單位組合。
function combineTransRomWhole(transRaw, romRaw, order, transRenderer, romRenderer) {
  transRaw = (transRaw || '').trim();
  romRaw = (romRaw || '').trim();
  if (!transRaw && !romRaw) return '';
  const tHtml = transRaw ? (transRenderer ? transRenderer(transRaw) : escapeHtml(transRaw)) : '';
  const rHtml = romRaw ? (romRenderer ? romRenderer(romRaw) : escapeHtml(romRaw)) : '';
  if (transRaw && romRaw) {
    return order === 'trans' ? `${tHtml}（${rHtml}）` : `${rHtml}（${tHtml}）`;
  }
  return tHtml || rHtml;
}

function renderSenseSection(lemmaId, dial) {
  let senses = sensesByLemma[lemmaKey(lemmaId, dial)];
  if (!senses || !senses.length) return '';
  if (selectedLevels.size < LEVELS.length) {
    senses = senses.filter(s => selectedLevels.has((s['等級'] || '').trim()));
    if (!senses.length) return '';
  }
  if (selectedCategories.size < ALL_CATEGORIES.length) {
    senses = senses.filter(s => selectedCategories.has((s['分類'] || '').trim()));
    if (!senses.length) return '';
  }

  const multi = senses.length > 1; // 編號依照原始義項數量決定，不因搜尋篩選掉幾筆而改變
  const senseEtyRaw = senses.map(s => (s['語源'] || '').trim());
  const senseEtyResolved = senseEtyRaw.map(raw => raw ? resolveEtymologyField(raw, dial) : null);

  const shared = senseEtyRaw.every(r => r && r === senseEtyRaw[0]) && senseEtyResolved[0];

  // 搜尋模式下（且範圍包含例句）：只保留「本身翻譯符合」或「至少有一筆例句符合」的義項，
  // 該義項底下也只顯示符合關鍵字的例句。編號仍用原始索引(idx+1)，不會因為跳過而重新編號。
  const inSearch = !!searchQuery;
  const noScope = !searchScope.lemma && !searchScope.example;
  const useLemmaSearch = inSearch && (noScope || searchScope.lemma);
  const useExampleSearch = inSearch && (noScope || searchScope.example);
  // 如果是「詞目本身」符合關鍵字（不是特定義項的翻譯符合），代表整個詞目都跟搜尋有關，
  // 底下所有義項都該顯示，不能只因為個別義項翻譯對不上、又沒有符合的例句就被濾掉。
  const lemmaWord = (lemmataById[lemmaKey(lemmaId, dial)] || {}).word || '';
  const lemmaMatchesDirectly = useLemmaSearch && textMatchesQuery(lemmaWord);

  let html = '';
  if (shared) {
    html += `<div class="ety-block">${senseEtyResolved[0].html}</div>`;
  }

  html += '<div class="sense-list">';
  senses.forEach((s, idx) => {
    let exList = examplesBySense[s['編號'] + '_' + s['義項']] || [];
    if (useExampleSearch) {
      exList = exList.filter(ex => textMatchesQuery(ex['語句']) || textMatchesQuery(ex['語句翻譯']));
      const senseMatchesDirectly = lemmaMatchesDirectly || (useLemmaSearch && textMatchesQuery(s['翻譯'], true));
      if (!exList.length && !senseMatchesDirectly) return; // 這個義項跟搜尋無關，略過不顯示
    }

    const num = multi ? `<span class="sense-num">${idx + 1}.</span>` : '';
    const lvl = LEVEL_ICONS[(s['等級'] || '').trim()] || '';
    const pos = (s['詞類'] || '').trim();
    const tag = (s['標籤'] || '').trim();
    const transRaw = (s['翻譯'] || '').trim();
    const romRaw = (s[romSystem] || '').trim();
    const transPieceRenderer = inSearch ? (piece => highlightSearchTerm(piece, searchQuery)) : null;
    const transHtml = combineTransRom(transRaw, romRaw, transOrder, transPieceRenderer);
    const conjCls = normalizeConjClass(s['動詞變化']);
    const conjShowable = conjCls && CONJ_DETAILED_CLASSES.has(conjCls) && (pos === '動' || pos === '形');
    const conjWord = (lemmataById[lemmaKey(lemmaId, dial)] || {}).word || '';
    const conjKey = `${lemmaId}-${s['義項']}`;
    const conjBadge = conjShowable
      ? `<button class="conj-badge" onclick="toggleConjPanel('${conjKey}', '${conjWord.replace(/'/g, "\\'")}', '${conjCls}', '${pos}')" title="動詞變化：點擊在右側開啟變化表">${escapeHtml(conjCls)}</button>`
      : '';
    html += `<div class="sense-item">`;
    html += `<div class="sense-head">${num}${lvl ? `<span class="level-icons">${lvl}</span>` : ''}${pos ? `<span class="ref-label">${escapeHtml(pos)}</span>` : ''}${conjBadge}${tag ? `<span class="ref-label">${escapeHtml(tag)}</span>` : ''}${transHtml ? `<span class="sense-trans">${transHtml}</span>` : ''}</div>`;
    if (!shared && senseEtyResolved[idx]) {
      html += `<div class="ety-block">${senseEtyResolved[idx].html}</div>`;
    }
    if (exList.length) {
      html += exList.map(ex => renderExampleBlock(ex, inSearch ? searchQuery : null)).join('');
    }
    html += renderNumericRefLine('近義詞', s['近義詞'], dial);
    html += renderNumericRefLine('反義詞', s['反義詞'], dial);
    html += renderNumericRefLine('相關詞', s['相關詞'], dial);
    html += renderDerivedWordsForSense(lemmaId, dial, s['義項']);
    html += renderNoteLine(s['附註'], lemmaId);
    html += `</div>`;
  });
  html += '</div>';
  html += renderDerivedWordsLine(lemmaId, dial);
  return html;
}

// 共用：把一組「引用詞目#引用義項」的集合，依引用詞目分組，
// 每個詞目只取真正引用到的那些義項的翻譯（不是該詞目全部義項），組成派生詞的顯示內容。
function renderDerivedWordsFromSet(citingSet, dial, uid) {
  if (!citingSet || !citingSet.size) return '';
  const byLemma = {};
  citingSet.forEach(entry => {
    const sep = entry.indexOf('#');
    const lid = sep === -1 ? entry : entry.slice(0, sep);
    const sid = sep === -1 ? '' : entry.slice(sep + 1);
    (byLemma[lid] = byLemma[lid] || new Set()).add(sid);
  });
  const fragments = [];
  Object.keys(byLemma).forEach(lid => {
    const lemma = lemmataById[lemmaKey(lid, dial)];
    if (!lemma) return; // 查無對應詞目，略過此筆
    const senseIds = byLemma[lid];
    const senses = sensesByLemma[lemmaKey(lid, dial)] || [];
    const trans = senses
      .filter(s => senseIds.has(s['義項']))
      .map(s => (s['翻譯'] || '').trim()).filter(Boolean).join('；');
    const wordHtml = `<a href="#lemma-${lid}-${dial}" class="ety-word" onclick="event.preventDefault();jumpToLemma('${lid}','${dial}')">${escapeHtml(lemma.word)}</a>`;
    fragments.push(wordHtml + (trans ? `「${escapeHtml(trans)}」` : ''));
  });
  if (!fragments.length) return '';
  const LIMIT = 5;
  if (fragments.length <= LIMIT) return fragments.join('；');
  const shown = fragments.slice(0, LIMIT).join('；');
  const restCount = fragments.length - LIMIT;
  const moreId = 'derived-more-' + (uid || Math.random().toString(36).slice(2));
  const rest = fragments.slice(LIMIT).join('；');
  return `${shown}；<span id="${moreId}" class="derived-more" style="display:none">${rest}</span>`
    + `<button class="derived-more-btn" onclick="toggleDerivedMore('${moreId}', this)" data-more="顯示全部(+${restCount})" data-less="收起">顯示全部(+${restCount})</button>`;
}

function toggleDerivedMore(id, btn) {
  const el = document.getElementById(id);
  if (!el) return;
  const showing = el.style.display !== 'none';
  el.style.display = showing ? 'none' : 'inline';
  btn.textContent = showing ? btn.dataset.more : btn.dataset.less;
}

// 派生詞（義項層級）：語源引用有 #義項編號 時，對齊顯示在該義項底下
function renderDerivedWordsForSense(lemmaId, dial, senseId) {
  if (!senseId) return '';
  const citingSet = derivedWordsBySense[lemmaKey(lemmaId, dial) + '_' + senseId];
  const inner = renderDerivedWordsFromSet(citingSet, dial, lemmaId + '-' + dial + '-' + senseId);
  if (!inner) return '';
  return `<div class="ref-row"><span class="ref-label">派生詞</span>${inner}</div>`;
}

// 派生詞：反向列出「哪些詞目的語源指向這個詞目」，呈現方式跟近/反義詞一致
function renderDerivedWordsLine(lemmaId, dial) {
  const citingSet = derivedWordsByLemma[lemmaKey(lemmaId, dial)];
  const inner = renderDerivedWordsFromSet(citingSet, dial, lemmaId + '-' + dial);
  if (!inner) return '';
  return `<div class="ref-row"><span class="ref-label">派生詞</span>${inner}</div>`;
}

function exampleAudioUrl(ex) {
  return ex['音檔'] || '';
}

function renderExampleBlock(ex, searchTerm) {
  const url = exampleAudioUrl(ex);
  const hasAudio = !!url;
  const sentenceHtml = nl2br(searchTerm
    ? highlightSearchTerm(ex['語句'] || '', searchTerm)
    : highlightTerm(ex['語句'] || '', ex['詞語'] || ''));

  // 例句翻譯：跟義項不同，這裡是「一整句」翻譯配一整句羅馬字，句子本身的逗號、分號只是
  // 標點符號、不是多重意義的分隔，所以不能像義項那樣拆開比對配對，要整句當一個單位組合。
  // 沒有搜尋時：中文部分比對該義項的中文關鍵字；羅馬字部分比對「同一套系統」自己的關鍵字
  // （顯示TL就比對TL關鍵字、顯示POJ就比對POJ關鍵字），不是兩套都比對。
  const romExampleField = romSystem === 'TL' ? '翻譯TL' : '翻譯POJ';
  const romSenseKeyword = ex[romSystem] || ''; // 該義項自己的 TL 或 POJ
  const transRenderer = searchTerm
    ? (piece => highlightSearchTerm(piece, searchTerm))
    : (piece => highlightTerm(piece, ex['翻譯'] || ''));
  const romRenderer = searchTerm
    ? (piece => highlightSearchTerm(piece, searchTerm))
    : (piece => highlightTerm(piece, romSenseKeyword));
  const transHtml = nl2br(combineTransRomWhole(
    ex['語句翻譯'] || '', ex[romExampleField] || '', transOrder,
    transRenderer, romRenderer
  ));

  const source = ex['出處'] || '';
  return `<div class="example-block">
    <div class="example-row">
      <div class="example-sentence">${sentenceHtml}</div>
      <button class="play-btn" ${hasAudio ? '' : 'disabled'}
        title="${hasAudio ? '播放音檔' : '無音檔'}"
        onclick="togglePlay('${url.replace(/'/g, "\\'")}', this)">${hasAudio ? '▶' : '—'}</button>
    </div>
    ${transHtml ? `<div class="example-trans">${transHtml}</div>` : ''}
    ${source ? `<div class="example-source">（${escapeHtml(source)}）</div>` : ''}
  </div>`;
}

// 對話式例句(-가:...\n-나:...)欄位裡保留的實際換行字元，轉成<br>才會在畫面上真的換行
// (HTML本身不會把純文字裡的換行符號顯示出來，得手動轉換；放在escapeHtml/highlight處理完之後，
// 因為那些函式都不會動到換行字元本身，這裡統一補上轉換即可)
function nl2br(html) { return (html || '').replace(/\n/g, '<br>'); }

// 在文字中找出目標詞彙/翻譯，套上金色＋前後間距（用於例句/例句翻譯的呼應標示）。
// 魯凱語是黏著語，詞素常常直接黏在一起，不能用「詞界」去限制比對範圍
// （那樣反而會漏掉很多合法的黏著變化），一律採用單純子字串比對。
// 若自動比對抓錯，可以直接在 08-Examples.csv 的語句/語句翻譯欄位裡，
// 用 ** 手動框出正確位置，例如：Padulrudulruaku ku **atukaanganeli** luiya.
// 一旦偵測到 ** 標記，就只採用人工標記的位置，不再自動比對。
function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function highlightTerm(text, term) {
  if (text.includes('**')) {
    return text.split(/(\*\*[^*]+\*\*)/g).map(part => {
      if (part.startsWith('**') && part.endsWith('**')) {
        return `<span class="term-highlight">${escapeHtml(part.slice(2, -2))}</span>`;
      }
      return escapeHtml(part);
    }).join('');
  }
  if (!term) return escapeHtml(text);
  const re = new RegExp(escapeRegex(term), 'gi');
  let result = '', lastIndex = 0, m;
  while ((m = re.exec(text)) !== null) {
    result += escapeHtml(text.slice(lastIndex, m.index));
    result += `<span class="term-highlight">${escapeHtml(m[0])}</span>`;
    lastIndex = m.index + m[0].length;
    if (m[0].length === 0) { re.lastIndex++; }
  }
  result += escapeHtml(text.slice(lastIndex));
  return result;
}

// 近義詞/反義詞/相關詞：跟語源的「純數字」解析方式相同（連結詞目＋顯示翻譯），前面加標籤
// 支援 | 分隔多筆資料，每筆各自佔一行（同一行內仍可用 + 連結多個來源）
// 近義詞/反義詞/相關詞：跟語源的「純數字」解析方式相同（連結詞目＋顯示翻譯），前面加標籤
// | 分隔多筆資料，改以「；」連接、同一行延伸下去（同一筆內仍可用 + 連結多個來源）
function renderNumericRefLine(label, raw, dial) {
  raw = (raw || '').trim();
  if (!raw) return '';
  const groups = raw.split('|').map(g => g.trim()).filter(Boolean);
  const rendered = groups.map(group => {
    const resolved = group.split('+').map(t => t.trim()).filter(Boolean)
      .map(t => resolveEtymologyToken(t, dial)).filter(r => r && r.type === 'numeric');
    if (!resolved.length) return null;
    return resolved.map(renderEtymologyFragment).join(' + ');
  }).filter(r => r !== null);
  if (!rendered.length) return '';
  return `<div class="ref-row"><span class="ref-label">${label}</span>${rendered.join('；')}</div>`;
}

// 假朋友(False friends)比較：附註欄位若整欄就是「A編號(#義項編號)=/B編號(#義項編號)」的指令
// （例如 1276=/6796，或帶義項的 1276#170012=/6796#170013），改渲染成獨立的警示比較區塊，
// 不走一般附註的文字處理。右邊的翻譯呈現順序/邏輯跟近/反義詞、相關詞完全一樣(直接沿用resolveEtymologyToken)。
// currentLemmaId：目前正在顯示的詞目編號——這個編號本身不用連結(已經在看這一頁)，
// 另一邊(不是目前這個詞目)的詞語才需要建立跳轉連結。
function renderFalseFriendsBlock(raw, currentLemmaId) {
  const m = raw.match(/^(\d+(?:\.\d+)?)(?:#(\d+(?:\.\d+)?))?=\/(\d+(?:\.\d+)?)(?:#(\d+(?:\.\d+)?))?$/);
  if (!m) return null;
  const [, aId, aSense, bId, bSense] = m;
  const aToken = aSense ? `${aId}#${aSense}` : aId;
  const bToken = bSense ? `${bId}#${bSense}` : bId;
  const a = resolveEtymologyToken(aToken, '');
  const b = resolveEtymologyToken(bToken, '');
  if (!a || !b) return null; // 查無對應詞目/義項，略過此筆

  const wordHtml = (r, id) => {
    const word = escapeHtml(r.word);
    if (String(id) === String(currentLemmaId)) return `<span class="ff-word">${word}</span>`;
    return `<a href="#lemma-${id}-" class="ff-word" onclick="event.preventDefault();jumpToLemma('${id}','')">${word}</a>`;
  };
  const aWordHtml = wordHtml(a, aId);
  const bWordHtml = wordHtml(b, bId);

  return `<div class="false-friends-block">
    <div class="ff-warn-row"><span class="ff-left">⚠ ${aWordHtml}</span><span class="ff-right">≠ ${b.trans || ''}</span></div>
    <div class="ff-row"><span class="ff-left">${aWordHtml}</span><span class="ff-right">= ${a.trans || ''}</span></div>
    <div class="ff-row"><span class="ff-left">${bWordHtml}</span><span class="ff-right">= ${b.trans || ''}</span></div>
  </div>`;
}

// 附註：若有「韓文字{詞目編號}」的寫法，把該韓文字轉成超連結到對應詞目，
// 並依左側選單設定附上該詞目的翻譯／羅馬字組合（跟近/反義詞、相關詞一致）；
// 若文字裡直接貼了圖片網址(.jpg/.png/.gif/.webp)，換成可點擊的縮圖，點一下浮現原圖視窗。
function renderNoteLine(raw, currentLemmaId) {
  raw = (raw || '').trim();
  if (!raw) return '';
  const ffBlock = renderFalseFriendsBlock(raw, currentLemmaId);
  if (ffBlock) return ffBlock;
  let escaped = escapeHtml(raw);
  escaped = escaped.replace(/(https?:\/\/\S+?\.(?:jpe?g|png|gif|webp))(?=[\s，。；！？]|$)/gi, (m, url) => {
    return `<img src="${url}" class="note-thumb" onclick="openImageModal('${url.replace(/'/g, "\\'")}')" alt="附註圖片">`;
  });
  const linked = escaped.replace(/([\uAC00-\uD7A3]+)\{(\d+(?:\.\d+)?)\}/g, (m, word, id) => {
    const resolved = resolveEtymologyToken(id, '');
    const transHtml = (resolved && resolved.trans) ? `「${resolved.trans}」` : '';
    return `<a href="#lemma-${id}-" class="ety-word" onclick="event.preventDefault();jumpToLemma('${id}','')">${word}</a>${transHtml}`;
  });
  return `<div class="ref-row"><span class="ref-label">附註</span>${linked}</div>`;
}

// 解析單一義項的「語源」欄位。
// + 代表同一句內組合多個來源（構詞分析，共用一個「源於」前綴）。
// | 代表完全獨立的多筆語源說法，各自成句（各自判斷是否要有「源於」），
// 句子之間用「，」連接，最後只有一個句號。
function resolveEtymologyGroupInner(rawGroup, dial) {
  const tokens = rawGroup.split('+').map(t => t.trim()).filter(Boolean);
  const resolved = tokens.map(t => resolveEtymologyToken(t, dial)).filter(Boolean);
  if (!resolved.length) return null;
  return {
    inner: resolved.map(renderEtymologyFragment).join(' + '),
    isPureNumeric: resolved.every(r => r.type === 'numeric')
  };
}

// | 代表多筆完全獨立的語源說法。第一筆維持原本前綴邏輯（源於／構詞省略），
// 之後每一筆改用「＜」連接（不再重複「源於」）。
function resolveEtymologyField(raw, dial) {
  const groups = raw.split('|').map(g => g.trim()).filter(Boolean);
  const parts = [];
  groups.forEach(g => {
    const res = resolveEtymologyGroupInner(g, dial);
    if (!res) return;
    if (parts.length === 0) {
      parts.push((res.isPureNumeric ? '' : '源於') + res.inner);
    } else {
      parts.push('＜' + res.inner);
    }
  });
  if (!parts.length) return null;
  return { html: parts.join('') + '。' };
}

function resolveEtymologyToken(token, dial) {
  // 純數字（可選 #義項編號，兩者皆可能帶小數點——詞目增減時的暫時錨定編號）：
  // 指向本詞典另一詞目（同一方言別內），或該詞目下特定義項
  const numMatch = token.match(/^(\d{1,7}(?:\.\d+)?)(?:#(\d+(?:\.\d+)?))?$/);
  if (numMatch) {
    const lemmaId = numMatch[1];
    const senseId = numMatch[2];
    const targetLemma = lemmataById[lemmaKey(lemmaId, dial)];
    if (!targetLemma) return null; // 同方言別內查無對應詞目，略過此筆

    let trans = '';
    if (senseId) {
      // 直接在該詞目自己的義項清單裡找，不用全域對照表——
      // 因為義項編號本身並非全域唯一（不同詞形可能剛好意思相同、編號重複），
      // 全域查找會有被別的詞目覆蓋、導致本來查得到的反而查不到的風險。
      const targetSense = (sensesByLemma[lemmaKey(lemmaId, dial)] || [])
        .find(s => s['義項'] === senseId);
      if (!targetSense) return null; // 查無對應義項，略過此筆
      trans = combineTransRom((targetSense['翻譯'] || '').trim(), (targetSense[romSystem] || '').trim(), transOrder);
    } else {
      // 韓語版：跟義項本身的翻譯欄一樣，要組合漢字翻譯跟TL/POJ(依左側選單設定)，
      // 每個義項先各自組合好，再用；串起多個義項
      trans = (sensesByLemma[lemmaKey(lemmaId, dial)] || [])
        .map(s => combineTransRom((s['翻譯'] || '').trim(), (s[romSystem] || '').trim(), transOrder))
        .filter(Boolean).join('；');
    }
    return { type: 'numeric', id: lemmaId, dial, word: targetLemma.word, trans };
  }

  // 拉丁字母+數字：指向 HLD-Etymology.csv（跨語言辭典共用，跟方言別無關）
  if (/^[A-Za-z]{3}\d+$/.test(token)) {
    const row = etymologyByCode[token];
    if (!row) return null; // 查無對應資料，略過此筆
    const lang = row['語言'];
    const word = row['詞語'];
    const t1 = row['轉寫1'];
    const t2 = row['轉寫2'];
    const trans = row['翻譯'];
    const url = row[''] || '';

    let translit = '';
    if (lang === '日語') {
      translit = (t1 && t2) ? (t1 + '，' + t2) : (t1 || t2);
    } else {
      translit = t1; // 除日語外，其餘語別(含閩語及未來新增的語別)一律顯示轉寫1
    }

    return {
      type: 'latin',
      lang, word, translit, trans,
      url: (lang === '原始南島語' && url) ? url : null
    };
  }

  return null;
}

function renderEtymologyFragment(r) {
  if (r.type === 'numeric') {
    const wordHtml = `<a href="#lemma-${r.id}-${r.dial}" class="ety-word" onclick="event.preventDefault();jumpToLemma('${r.id}','${r.dial}')">${escapeHtml(r.word)}</a>`;
    return wordHtml + (r.trans ? `「${r.trans}」` : '');
  }
  const langHtml = `<span class="ety-lang">${escapeHtml(r.lang)}</span>`;
  const wordHtml = r.url
    ? `<a href="${r.url}" target="_blank" rel="noopener" class="ety-word">${escapeHtml(r.word)}</a>`
    : `<span class="ety-word">${escapeHtml(r.word)}</span>`;
  const translitHtml = r.translit ? `（${escapeHtml(r.translit)}）` : '';
  const transHtml = r.trans ? `「${escapeHtml(r.trans)}」` : '';
  return langHtml + wordHtml + translitHtml + transHtml;
}

// 自行實作平滑捲動（用 requestAnimationFrame），取代瀏覽器原生 scrollTo({behavior:'smooth'})。
// 原生做法在「上一次捲動動畫還沒播完、又馬上觸發下一次」時，有些瀏覽器會直接忽略新的請求，
// 導致連續快速點擊不同字母時，後面的點擊看起來「沒反應」。自行控制動畫可以保證新的呼叫
// 永遠會取消並取代前一個還在進行中的捲動。
let _scrollAnimId = null;
function smoothScrollContentTo(targetTop) {
  const content = document.getElementById('content');
  if (!content) return;
  if (_scrollAnimId) cancelAnimationFrame(_scrollAnimId);
  const startTop = content.scrollTop;
  const distance = targetTop - startTop;
  const duration = 420;
  const startTime = performance.now();
  function step(now) {
    const t = Math.min(1, (now - startTime) / duration);
    const eased = 1 - Math.pow(1 - t, 3); // ease-out
    content.scrollTop = startTop + distance * eased;
    _scrollAnimId = (t < 1) ? requestAnimationFrame(step) : null;
  }
  _scrollAnimId = requestAnimationFrame(step);
}

function scrollContentTo(el, extraOffset) {
  const content = document.getElementById('content');
  if (!el || !content) return;
  const contentRect = content.getBoundingClientRect();
  const elRect = el.getBoundingClientRect();
  const offset = elRect.top - contentRect.top + content.scrollTop - (extraOffset || 0);
  smoothScrollContentTo(offset);
}

function jumpToLemma(id, dial) {
  const target = lemmataById[lemmaKey(id, dial)];
  if (!target) return;
  if (target.letter !== activeLetter || searchQuery) {
    switchLetter(target.letter, () => {
      scrollContentTo(document.getElementById('lemma-' + id + '-' + dial));
    });
  } else {
    scrollContentTo(document.getElementById('lemma-' + id + '-' + dial));
  }
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function scrollContentToTop() {
  smoothScrollContentTo(0);
}

// ── Audio playback ──
let currentAudio = null, currentBtn = null;
function stopAudio() {
  if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }
  if (currentBtn) { currentBtn.textContent = '▶'; currentBtn.classList.remove('active'); }
  currentAudio = null; currentBtn = null;
}
function togglePlay(url, btn) {
  if (!url) return;
  if (currentBtn === btn && currentAudio && !currentAudio.paused) { stopAudio(); return; }
  stopAudio();
  currentAudio = new Audio(url);
  currentBtn = btn;
  btn.textContent = '⏸'; btn.classList.add('active');
  currentAudio.onended = stopAudio;
  currentAudio.play().catch(() => {
    showToast('⚠ 音檔無法播放，請檢查網路連線');
    stopAudio();
  });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// 附註裡的圖片縮圖：點一下用浮現視窗顯示原圖，再點一下(或點視窗任何地方)關閉
function openImageModal(url) {
  const modal = document.getElementById('imgModal');
  document.getElementById('imgModalImg').src = url;
  modal.classList.add('show');
}
function closeImageModal() {
  document.getElementById('imgModal').classList.remove('show');
}

// 截圖分享：把指定的詞條方塊轉成圖片，手機上可直接叫出系統分享選單(郵件/訊息/社群)，
// 桌面瀏覽器若不支援檔案分享，退回成直接下載圖片。
async function shareEntryCard(event, elementId) {
  event.preventDefault();
  event.stopPropagation();
  const el = document.getElementById(elementId);
  if (!el) return;
  if (typeof html2canvas === 'undefined') {
    showToast('⚠ 截圖功能載入失敗，請檢查網路連線');
    return;
  }
  const btn = event.currentTarget;
  const shareBtnEl = el.querySelector('.share-btn');
  btn.disabled = true;
  if (shareBtnEl) shareBtnEl.style.visibility = 'hidden'; // 截圖時先隱藏按鈕本身，畫面比較乾淨
  try {
    const bgColor = getComputedStyle(document.body).getPropertyValue('--bg').trim() || '#0e0e0e';
    const canvas = await html2canvas(el, { backgroundColor: bgColor, scale: 2, useCORS: true });
    const wordText = (el.querySelector('.word-main')?.textContent || 'entry').trim();
    const fileName = wordText.replace(/[\\/:*?"<>|]/g, '') + '.png';

    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
    if (!blob) throw new Error('canvas.toBlob 回傳空值');

    let shared = false;
    try {
      const file = new File([blob], fileName, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: document.title, text: wordText });
        shared = true;
      }
    } catch (shareErr) {
      // 使用者取消分享，或分享API本身不支援，都改走下方的下載流程
    }
    if (!shared) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = fileName;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showToast('已下載圖片 ' + fileName);
    }
  } catch (err) {
    console.error('截圖分享失敗:', err);
    showToast('⚠ 截圖失敗，請重試');
  } finally {
    btn.disabled = false;
    if (shareBtnEl) shareBtnEl.style.visibility = '';
  }
}

// ── Theme & Font Size ──
const FS_SIZES = ['sm', 'md', 'lg', 'xl'];
function setFontSize(size, silent) {
  if (!FS_SIZES.includes(size)) size = 'md';
  document.body.className = document.body.className.replace(/\bfs-\w+\b/g, '').trim();
  document.body.classList.add('fs-' + size);
  FS_SIZES.forEach(s => {
    const btn = document.getElementById('fs-' + s);
    if (btn) btn.classList.toggle('active', s === size);
  });
  try { localStorage.setItem('hlddru_fs', size); } catch (e) {}
}
let _theme = 'dark';
function _applyTheme(theme, silent) {
  _theme = theme;
  document.body.classList.toggle('light', theme === 'light');
  const btn = document.getElementById('themeBtn');
  if (btn) btn.textContent = theme === 'light' ? '🌙' : '☀️';
  try { localStorage.setItem('hlddru_theme', theme); } catch (e) {}
}
function toggleTheme() { _applyTheme(_theme === 'dark' ? 'light' : 'dark'); }

// ── Sidebar collapse ──
let _sidebarCollapsed = false;
function toggleSidebar() {
  _sidebarCollapsed = !_sidebarCollapsed;
  const sb = document.getElementById('sidebar');
  const tab = document.getElementById('sbToggleTab');
  if (sb) sb.classList.toggle('collapsed', _sidebarCollapsed);
  if (tab) tab.textContent = _sidebarCollapsed ? '▶' : '◀';
  try { localStorage.setItem('hlddru_sb_collapsed', _sidebarCollapsed ? '1' : '0'); } catch (e) {}
  setTimeout(layoutLetterGrids, 250);
}

// ── Scroll-to-top button visibility ──
(function bindScrollTopVisibility() {
  function bind() {
    const el = document.getElementById('content');
    if (!el) return;
    el.addEventListener('scroll', () => {
      const btn = document.getElementById('scrollTopBtn');
      if (!btn) return;
      btn.classList.toggle('visible', el.scrollTop > 300);
    });
  }
  document.addEventListener('DOMContentLoaded', bind);
})();

(function loadPrefs() {
  try {
    setFontSize(localStorage.getItem('hlddru_fs') || 'md');
    const th = localStorage.getItem('hlddru_theme') || 'dark';
    if (th === 'light') _applyTheme('light');
    if (localStorage.getItem('hlddru_sb_collapsed') === '1') {
      _sidebarCollapsed = true;
      const sb = document.getElementById('sidebar');
      const tab = document.getElementById('sbToggleTab');
      if (sb) sb.classList.add('collapsed');
      if (tab) tab.textContent = '▶';
    }
  } catch (e) {}
})();

loadData();
